<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [dismissableMask]="false"
  [style]="{ width: '480px', maxWidth: '92vw' }"
  styleClass="report-dialog"
  (onHide)="close()">
  <ng-template pTemplate="header">
    <div class="flex items-center gap-3">
      <div
        class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 text-white shadow-md shadow-sky-500/20">
        <i class="pi pi-file-excel text-lg"></i>
      </div>
      <div class="leading-tight">
        <h3 class="m-0 text-base font-semibold text-slate-900 dark:text-white">{{ 'report.header.title' | translate }}</h3>
        <p class="m-0 text-xs text-slate-500">{{ 'report.header.subtitle' | translate }}</p>
      </div>
    </div>
  </ng-template>

  <div class="space-y-5">
    <div class="rounded-xl bg-sky-50 p-4 ring-1 ring-sky-100 dark:bg-sky-500/10 dark:ring-sky-500/20">
      <p class="m-0 text-sm leading-relaxed text-slate-700 dark:text-slate-300">
        {{ 'report.info' | translate }} <span class="font-semibold text-slate-900">{{ 'report.info.after' | translate }}</span>.
      </p>
    </div>

    <div>
      <label for="reportFromDate" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">
        {{ 'report.fromDate' | translate }} <span class="text-rose-500">*</span>
      </label>
      <div class="p-fluid">
        <p-calendar
          inputId="reportFromDate"
          [(ngModel)]="fromDate"
          [showIcon]="true"
          dateFormat="dd/mm/yy"
          [maxDate]="today"
          [readonlyInput]="true"
          [appendTo]="'body'"
          [placeholder]="'report.selectDate' | translate"></p-calendar>
      </div>
      <p class="mt-2 text-xs leading-relaxed text-slate-500 dark:text-slate-400">
        {{ 'report.helper' | translate }}
      </p>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex w-full items-center justify-between gap-3">
      <button pButton [label]="'report.cancel' | translate" styleClass="p-button-text" (click)="close()"></button>
      <div class="flex items-center gap-2">
        <button
          pButton
          [label]="'report.exportCsv' | translate"
          icon="pi pi-file-csv"
          styleClass="p-button-outlined"
          [loading]="exporting"
          [disabled]="!fromDate || exporting"
          (click)="exportCsv()"></button>
        <button
          pButton
          [label]="'report.exportExcel' | translate"
          icon="pi pi-file-excel"
          [loading]="exporting"
          [disabled]="!fromDate || exporting"
          (click)="exportExcel()"></button>
      </div>
    </div>
  </ng-template>
</p-dialog>
